<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BugBoing Profile</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f6f4ef; color: #171717; }
      main { max-width: 34rem; margin: 4rem auto; padding: 2rem; background: #fff; border: 1px solid #ddd7cb; border-radius: 12px; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      label { display: block; font-weight: 600; margin-bottom: .35rem; }
      input { font: inherit; padding: .5rem .6rem; width: 100%; box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px; }
      .actions { margin-top: 1rem; }
      button { font: inherit; padding: .45rem .9rem; cursor: pointer; }
      #status { margin-top: 1rem; min-height: 1.5rem; }
      .error { color: #9a3412; }
      .success { color: #146c43; }
    </style>
  </head>
  <body>
    <main>
      <h1>Profile</h1>
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="off" value="Ada" />
      <div class="actions">
        <button id="save" type="button">Save changes</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
